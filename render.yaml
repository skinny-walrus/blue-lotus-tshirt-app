services:
  - type: web
    name: blue-lotus-tshirt-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: FLASK_SECRET_KEY
        generateValue: true
